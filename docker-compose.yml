services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: room_booking
      POSTGRES_USER: rb
      POSTGRES_PASSWORD: rb
    ports: [ "5432:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rb -d room_booking" ]
      interval: 5s
      retries: 10
volumes:
  pgdata:
