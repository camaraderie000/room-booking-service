spring:
  application:
    name: room-booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/room_booking}
    username: ${DB_USER:rb}
    password: ${DB_PASSWORD:rb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  zone-id: ${APP_ZONE:UTC}
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:change-me-please}